<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game-screen.css">
    <title>El Pollo Loco</title>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/collectible-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/level1.js"></script>
    <script src="js/game.js"></script>
    <script defer src="js/game-screen.js"></script>
</head>

<body>
    <h1>El Pollo Loco</h1>

    <section id="game-container">
        <div id="game-stage">
            <canvas id="canvas" width="720" height="480"></canvas>

            <div id="game-screen">
                <img id="game-screen-image" src="img/startscreen/startScreen.png" alt="El Pollo Loco">
                <button id="game-screen-button" type="button">Spiel starten</button>
            </div>
        </div>

        <div class="mobile-controls">
            <div>
                <button id="btnLeft" type="button" aria-label="Nach links laufen">‹</button>
                <button id="btnRight" type="button" aria-label="Nach rechts laufen">›</button>
            </div>

            <div>
                <button id="btnJump" type="button" aria-label="Springen">↑</button>
                <button id="btnThrow" type="button" aria-label="Flasche werfen">
                    <img src="img/7_statusbars/3_icons/icon_salsa_bottle.png" alt="">
                </button>
            </div>
        </div>

        <p class="keyboard-help">
            <strong>Tastatur</strong>
            <span><kbd>←</kbd> <kbd>→</kbd> Laufen</span>
            <span><kbd>Leertaste</kbd> Springen</span>
            <span><kbd>D</kbd> Flasche werfen</span>
        </p>
    </section>
</body>

</html>
