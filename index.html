<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>El Pollo Loco</title>

    <style>
        .keyboard-help {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 16px;
            margin: 8px 0 0;
            padding: 10px 12px;
            border-radius: 6px;
            background-color: #302016;
            color: #fff;
            font: 600 16px/1.5 Arial, sans-serif;
        }

        .keyboard-help kbd {
            display: inline-block;
            padding: 0 6px;
            border-radius: 4px;
            background-color: #ffd27a;
            color: #302016;
            font: inherit;
        }
    </style>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/collectible-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/level1.js"></script>
    <script src="js/game.js"></script>
</head>

<body onload="init()">
    <h1>El Pollo Loco</h1>

    <section id="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="mobile-controls">
            <div>
                <button id="btnLeft" type="button" aria-label="Nach links laufen">‹</button>
                <button id="btnRight" type="button" aria-label="Nach rechts laufen">›</button>
            </div>

            <div>
                <button id="btnJump" type="button" aria-label="Springen">↑</button>
                <button id="btnThrow" type="button" aria-label="Flasche werfen">
                    <img src="img/7_statusbars/3_icons/icon_salsa_bottle.png" alt="">
                </button>
            </div>
        </div>

        <p class="keyboard-help">
            <strong>Tastatur</strong>
            <span><kbd>←</kbd> <kbd>→</kbd> Laufen</span>
            <span><kbd>Leertaste</kbd> Springen</span>
            <span><kbd>D</kbd> Flasche werfen</span>
        </p>
    </section>
</body>

</html>
